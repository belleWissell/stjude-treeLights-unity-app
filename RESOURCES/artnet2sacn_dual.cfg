[backend artnet]
bind = 127.0.0.1
detect = verbose

[artnet art_in1]
universe = 0

[artnet art_in2]
universe = 1

[backend sacn]
bind = 192.168.0.32
name = marnoldOut2

[sacn sacn_out1]
universe = 1
priority = 100

[sacn sacn_out2]
universe = 2
priority = 100

[map]
art_in1.{1..512} > sacn_out1.{1..512}
art_in2.{1..512} > sacn_out2.{1..512}
